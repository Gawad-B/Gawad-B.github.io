<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-pro</title>
<meta name="viewport" content="width=1200">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..800&display=swap">
<style>
  /* Rendered at exactly 1200x630 by headless Chromium into public/og-pro.png.
     Mirrors the professional page hero: red field, faint construction grid,
     tone-on-tone GAWAD, cut-out portrait bottom-anchored on the right. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #cf3b24; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #cf3b24; color: #fff; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
  }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(rgb(0 0 0 / 0) 55%, rgb(0 0 0 / 0.22));
  }
  .grid { position: absolute; inset: 0; }
  .grid i { position: absolute; background: rgb(255 255 255 / 0.18); }
  .grid .v { top: 0; bottom: 0; width: 1px; }
  .grid .h { left: 0; right: 0; height: 1px; }
  .giant {
    position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
    font-weight: 800; font-size: 330px; line-height: 1; letter-spacing: -0.045em;
    white-space: nowrap; color: rgb(255 255 255 / 0.13);
  }
  .portrait { position: absolute; right: -60px; bottom: 0; height: 590px; width: auto; display: block; }
  .role {
    position: absolute; left: 80px; bottom: 218px;
    font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .name {
    position: absolute; left: 80px; bottom: 60px;
    font-weight: 800; font-size: 92px; line-height: 0.92; letter-spacing: -0.035em; text-transform: uppercase;
  }
  .url { position: absolute; right: 60px; bottom: 60px; font-weight: 500; font-size: 20px; letter-spacing: 0.01em; }
</style>
</head>
<body>
<div class="card">
  <div class="shade"></div>
  <div class="grid" aria-hidden="true">
    <i class="v" style="left:80px"></i><i class="v" style="left:420px"></i><i class="v" style="left:780px"></i><i class="v" style="left:1120px"></i>
    <i class="h" style="top:74px"></i><i class="h" style="top:300px"></i>
  </div>
  <div class="giant" aria-hidden="true">GAWAD</div>
  <img class="portrait" src="../public/assets/pro/portrait.webp" alt="">
  <div class="role">Full-stack &amp; AI/ML engineer</div>
  <div class="name">Abdelrahman<br>Gawad</div>
  <div class="url">gawad-b.github.io</div>
</div>
</body>
</html>
